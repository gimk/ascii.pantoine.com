<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Terminal Background -->
  <rect width="64" height="64" rx="14" fill="#030a06"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#00ff66" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Matrix / Spiral Wave Character Pattern -->
  <g font-family="monospace, 'Courier New', sans-serif" font-weight="900" text-anchor="middle" filter="url(#crt-glow)">
    <!-- Outer Arms -->
    <text x="32" y="14" font-size="9" fill="#00aa44" opacity="0.7">:::</text>
    <text x="14" y="24" font-size="8" fill="#00cc55" opacity="0.8">==</text>
    <text x="50" y="24" font-size="8" fill="#00cc55" opacity="0.8">==</text>
    <text x="10" y="36" font-size="9" fill="#00ff66" opacity="0.9">▓▒</text>
    <text x="54" y="36" font-size="9" fill="#00ff66" opacity="0.9">▒▓</text>

    <!-- Spiral Wave Vortex Core -->
    <text x="24" y="27" font-size="9" fill="#00ff66">▓▓</text>
    <text x="40" y="27" font-size="8" fill="#33ff88">▒▒</text>
    <text x="32" y="36" font-size="13" fill="#ffffff">█</text>
    <text x="22" y="44" font-size="8" fill="#33ff88">▒▒</text>
    <text x="40" y="44" font-size="9" fill="#00ff66">▓▓</text>

    <!-- Lower Vortex Ripple -->
    <text x="16" y="52" font-size="8" fill="#00cc55" opacity="0.8">==</text>
    <text x="48" y="52" font-size="8" fill="#00cc55" opacity="0.8">==</text>
    <text x="32" y="57" font-size="9" fill="#00aa44" opacity="0.7">:::</text>
  </g>

  <!-- Scanline texture overlay -->
  <line x1="2" y1="16" x2="62" y2="16" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="2" y1="24" x2="62" y2="24" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="2" y1="40" x2="62" y2="40" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="2" y1="48" x2="62" y2="48" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
</svg>
