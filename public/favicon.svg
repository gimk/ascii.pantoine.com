<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 50% Bayer / Checkerboard Dither Pattern -->
    <pattern id="bayer50" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#040805"/>
      <rect x="0" y="0" width="2" height="2" fill="#00ff66"/>
      <rect x="2" y="2" width="2" height="2" fill="#00ff66"/>
    </pattern>
    <!-- 25% Sparse Dither Pattern -->
    <pattern id="bayer25" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#040805"/>
      <rect x="0" y="0" width="2" height="2" fill="#00ff66"/>
    </pattern>
    <!-- Phosphor radial glow -->
    <radialGradient id="termGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040805" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Terminal Rounded Base -->
  <rect width="64" height="64" rx="14" fill="#050a06"/>
  <rect width="64" height="64" rx="14" fill="url(#termGlow)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Minimalist Isometric Dither Cube -->
  <!-- Top Face: 100% Solid Phosphor Highlight -->
  <polygon points="32,12.5 52.8,24.5 32,36.5 11.2,24.5" fill="#00ff66"/>

  <!-- Left Face: 50% Dither Shade -->
  <polygon points="11.2,24.5 32,36.5 32,51.5 11.2,39.5" fill="url(#bayer50)" stroke="#00ff66" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Right Face: 25% Dither Shadow -->
  <polygon points="32,36.5 52.8,24.5 52.8,39.5 32,51.5" fill="url(#bayer25)" stroke="#00ff66" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Crisp seam separation -->
  <polyline points="11.2,24.5 32,36.5 52.8,24.5" fill="none" stroke="#040805" stroke-width="1.5"/>
  <line x1="32" y1="36.5" x2="32" y2="51.5" stroke="#00ff66" stroke-width="1" stroke-opacity="0.75"/>
</svg>